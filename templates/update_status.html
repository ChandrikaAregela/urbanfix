{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow p-4">
            <h2 class="text-center mb-4"> Update Complaint Status </h2>

            <h4>
                {{ complaint[1] }}
            </h4>

            <p>
                <b>Area:</b>
                {{ complaint[2] }}
            </p>

            <p>
                <b>Current Status:</b>
                {{ complaint[6] }}
            </p>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">
                        Change Status
                    </label>

                    <select
                        name="status"
                        class="form-select"
                    >

                        <option>Pending</option>
                        <option>In Progress</option>
                        <option>Resolved</option>
                    </select>
                </div>
                <button
                    type="submit"
                    class="btn btn-primary w-100"
                >
                    Update Status
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
